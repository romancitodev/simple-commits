[package]
name = "simple-commit"
description = "A little CLI written in rust to improve your dirty commits into conventional ones. "
repository = "https://github.com/romancitodev/simple-commits"
version = "1.0.2"
edition = "2024"
license = "MIT"

[package.metadata.wix]
upgrade-guid = "C20E12CB-E616-45DF-8B01-11541D65C6CE"
path-guid = "E4D36954-1F3E-4535-A0BA-B439FA323671"
license = false
eula = false

[[bin]]
name = "sc"
path = "src/main.rs"

[dependencies]
thiserror = "1"
# cliclack = "0.3.7"
clap = { version = "4.5.3", features = ["derive"] }
clap_derive = { version = "4.0.0-rc.1" }
colored = "2.1.0"
directories = "5.0.1"
env_logger = "0.11.3"
fuzzy-matcher = "0.3.7"
log = "0.4.21"
merge2 = "0.3.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "rt-multi-thread"] }
toml = "0.8.8"
nobubbles = { git = "https://github.com/romancitodev/nobubbles", branch = "feat/rimel", version = "0.1.0", features = ["gradient"] }
eyre = "0.6.14"
git2 = { version = "0.21.0", default-features = false }
tempfile = "3.27.0"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.18.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# A GitHub repo to push Homebrew formulas to
tap = "romancitodev/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Host jobs to run in CI
host-jobs = ["./gen_changelog"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Publish jobs to run in CI
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
